# console-api on its own: its API listens on 8083. It needs Postgres, Kafka and the optimizer, which this file does
# not start: by default it joins the Docker network `loong` of deploy/docker-compose.yml (scripts/dev-up.sh) and
# reaches Postgres and Redpanda as postgres:5432 and redpanda:9092, and the optimizer (services/optimizer/compose.yaml)
# as optimizer:8090. To use other infrastructure, set DATABASE_URL, KAFKA_BROKERS and OPTIMIZER_URL (in the shell or
# in a .env next to this file) and drop the network below.
#
#   docker compose -f services/console/compose.yaml up --build
name: loong-console

services:
  console-api:
    build:
      context: ../..
      dockerfile: services/console/Dockerfile
    image: loong/console-api:dev
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8083"
      DATABASE_URL: ${DATABASE_URL:-postgres://console:loong_dev@postgres:5432/console?sslmode=disable}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://optimizer:8090}
      # The shared secret of the optimizer (the same value as its OPTIMIZER_TOKEN). The default is for development only.
      OPTIMIZER_TOKEN: ${OPTIMIZER_TOKEN:-dev-optimizer-token}
      # How long to wait for a quote; it must outlast the optimizer's OPTIMIZER_TIMEOUT_DEEP (150s). Empty keeps 3m.
      OPTIMIZER_CALL_TIMEOUT: ${OPTIMIZER_CALL_TIMEOUT:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://console.loong.localhost}
      # Lets a top-up be credited without paying. Development only.
      SIMULATE_PAYMENTS: ${SIMULATE_PAYMENTS:-false}
      # How long a cancel waits for the drivers' votes before it is aborted.
      CANCEL_TIMEOUT: ${CANCEL_TIMEOUT:-2m}
      # The AI gateway (services/ai) and its shared bearer token. Empty AI_URL: every AI feature is reported off.
      AI_URL: ${AI_URL:-}
      AI_TOKEN: ${AI_TOKEN:-}
      # Per-customer limits on AI requests (burst, then per minute); empty takes the defaults (10 and 20).
      AI_USER_RATE_BURST: ${AI_USER_RATE_BURST:-}
      AI_USER_RATE_PER_MINUTE: ${AI_USER_RATE_PER_MINUTE:-}
      # How often the proof-photo reader looks for a new photo (runs only with AI_URL); empty takes 2s.
      PROOF_AI_POLL: ${PROOF_AI_POLL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [loong]

networks:
  loong:
    external: true
    name: loong
