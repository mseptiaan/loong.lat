# backoffice-api on its own: its API listens on 8082. It needs Postgres and Kafka, which this file does not start:
# by default it joins the Docker network `loong` of deploy/docker-compose.yml (scripts/dev-up.sh) and reaches them
# as postgres:5432 and redpanda:9092. To use other infrastructure, set DATABASE_URL and KAFKA_BROKERS (in the
# shell or in a .env next to this file) and drop the network below.
#
# The first admin is created from ADMIN_EMAIL and ADMIN_PASSWORD when no admin has that email.
#
#   docker compose -f services/backoffice/compose.yaml up --build
name: loong-backoffice

services:
  backoffice-api:
    build:
      context: ../..
      dockerfile: services/backoffice/Dockerfile
    image: loong/backoffice-api:dev
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8082"
      DATABASE_URL: ${DATABASE_URL:-postgres://backoffice:loong_dev@postgres:5432/backoffice?sslmode=disable}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://backoffice.loong.localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      DISPATCH_WORKER: ${DISPATCH_WORKER:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      # The AI gateway (services/ai) and its shared bearer token. Empty AI_URL: the Copilot and the summary answer that
      # they are having problems (the admin's switches are shown unchanged).
      AI_URL: ${AI_URL:-}
      AI_TOKEN: ${AI_TOKEN:-}
      # Per-admin limits on AI requests (burst, then per minute); empty takes the defaults (10 and 20).
      AI_USER_RATE_BURST: ${AI_USER_RATE_BURST:-}
      AI_USER_RATE_PER_MINUTE: ${AI_USER_RATE_PER_MINUTE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [loong]

networks:
  loong:
    external: true
    name: loong
