# driver-api on its own: its API listens on 8081. It needs Postgres and Kafka, which this file does not start:
# by default it joins the Docker network `loong` of deploy/docker-compose.yml (scripts/dev-up.sh) and reaches them
# as postgres:5432 and redpanda:9092. To use other infrastructure, set DATABASE_URL and KAFKA_BROKERS (in the
# shell or in a .env next to this file) and drop the network below.
#
#   docker compose -f services/driver/compose.yaml up --build
name: loong-driver

services:
  driver-api:
    build:
      context: ../..
      dockerfile: services/driver/Dockerfile
    image: loong/driver-api:dev
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: ${DATABASE_URL:-postgres://driver:loong_dev@postgres:5432/driver?sslmode=disable}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      # Web origins allowed to call this API from a browser (comma separated).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://driver.loong.localhost}
      # How often running routes are checked for delays (route.delayed), e.g. 30s.
      DELAY_SWEEP_INTERVAL: ${DELAY_SWEEP_INTERVAL:-30s}
      # The AI gateway (services/ai). Empty: settings.get reports every AI feature as off. This service builds no AI feature.
      AI_URL: ${AI_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [loong]

networks:
  loong:
    external: true
    name: loong
