# Satu nginx untuk keempat situs statis, dipilih dari label pertama hostname (sama dengan scripts/dev-gateway.mjs):
#   console.<domain> -> /srv/console    backoffice.<domain> -> /srv/backoffice    driver.<domain> -> /srv/driver
#   domain induk dan host lain        -> /srv/landing
# TLS, HSTS, dan pengalihan HTTPS diurus Traefik/Cloudflare di depannya.
map $host $site {
    default         landing;
    ~^console\.     console;
    ~^backoffice\.  backoffice;
    ~^driver\.      driver;
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/$site;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # berkas ber-hash dari Vite: tidak pernah berubah isinya
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # service worker harus selalu diperiksa ulang
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # manifest PWA driver: tipe resmi (mime.types bawaan nginx tidak mengenal .webmanifest)
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # worker MapLibre dimuat sebagai module worker: peramban menolaknya bila tipenya bukan JavaScript
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # gambar tanpa hash: cache sehari
    location ~* \.(webp|png|svg|woff2|geojson)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # aplikasi satu halaman: rute yang tidak ada jatuh ke index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
